[project]
name = "rv32i-core-verif"
version = "0.1.0"
description = "5-stage pipelined RV32I CPU in SystemVerilog, verified with cocotb + Verilator against a Python golden model"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # cocotb 1.9 marks its Python runner API as experimental; we use it on purpose.
    "ignore:Python runners and associated APIs are an experimental feature:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["sim_build", "build", "third_party"]  # never lint or reformat vendored code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["model", "tb", "tools"]
known-local-folder = ["cocotb_runner"]  # tests/rtl helper, imported by the cocotb test modules
